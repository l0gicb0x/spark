[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-desktop"
version = "0.1.0"
description = "A text-first Windows desktop assistant foundation"
requires-python = ">=3.12"
dependencies = [
  "google-genai==2.34.0",
  "keyring==25.7.0",
  "PySide6==6.12.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-qt==4.5.0", "ruff==0.17.3"]

[project.scripts]
spark = "spark.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
